<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ER-диаграмма</title>
    <style>

            display: grid;
            place-items: center;
            background: #f2f4f7;
            font-family: Arial, sans-serif;
        }
        svg {
            width: min(920px, 96vw);
            height: auto;
            background: #fff;
            border: 1px solid #cfd6e4;
        }

</head>
<body>
    <svg viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg">

        <rect x="60" y="80" width="280" height="360" rx="6" fill="#eef6ff" stroke="#2f6fed" stroke-width="2"/>

        <text x="80" y="356" font-size="16" fill="#1b2430">role  TEXT</text>

        <text x="540" y="300" text-anchor="middle" font-size="16" fill="#1b2430">N</text>

</html>
